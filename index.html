<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>شاشة التحكم عن بعد الشاملة</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Header */
        .header {
            padding: 10px 15px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
        }
        .status-dot.online { background: #22c55e; }
        .ip-input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 5px 10px;
            border-radius: 6px;
            width: 140px;
            text-align: center;
            font-weight: bold;
        }
        .btn-connect {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* Quick Actions Bar */
        .actions-bar {
            display: flex;
            gap: 8px;
            padding: 10px;
            overflow-x: auto;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .app-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .app-btn:active { transform: scale(0.95); }

        /* Screen & Touchpad Viewport */
        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        #screenView {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Bottom Controls Bar */
        .controls-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 10px;
            background: #1e293b;
        }
        .ctrl-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }
        .ctrl-btn:active { background: #475569; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <span id="statusDot" class="status-dot"></span>
            <span style="font-size: 13px; margin-right: 5px;">التحكم حي</span>
        </div>
        <input type="text" id="ipAddress" class="ip-input" value="192.168.1.100" placeholder="IP الكمبيوتر">
        <button class="btn-connect" onclick="connect()">اتصال</button>
    </div>

    <!-- شريط تنقل سريع لفتح صفحات البرنامج -->
    <div class="actions-bar">
        <button class="app-btn" onclick="openForm('POS')">🛒 الفواتير</button>
        <button class="app-btn" onclick="openForm('INVENTORY')">📦 المخزن</button>
        <button class="app-btn" onclick="openForm('REPORTS')">📊 التقارير</button>
    </div>

    <!-- الشاشة الحية الملموسة -->
    <div class="viewport" id="touchArea">
        <img id="screenView" src="" alt="بانتظار الصورة الحية...">
    </div>

    <!-- أزرار الماوس والسكرول بالأسفل -->
    <div class="controls-bar">
        <button class="ctrl-btn" onclick="sendCmd('CLICK_LEFT')">🖱️ كليك شمال</button>
        <button class="ctrl-btn" onclick="sendCmd('SCROLL|100')">🔼 سكرول للأعلى</button>
        <button class="ctrl-btn" onclick="sendCmd('CLICK_RIGHT')">🖱️ كليك يمين</button>
        <button class="ctrl-btn" style="grid-column: span 3; background: #0284c7;" onclick="sendCmd('SCROLL|-100')">🔽 سكرول لأسفل</button>
    </div>

    <script>
        let ws = null;
        let lastTouchX = 0;
        let lastTouchY = 0;

        function connect() {
            const ip = document.getElementById('ipAddress').value.trim();
            if (!ip) return alert("يرجى كتابة الـ IP الخاص بالكمبيوتر");

            ws = new WebSocket(`ws://${ip}:8080`);

            ws.onopen = () => {
                document.getElementById('statusDot').classList.add('online');
            };

            ws.onclose = () => {
                document.getElementById('statusDot').classList.remove('online');
            };

            ws.onmessage = (event) => {
                const data = event.data;
                if (data.startsWith("FRAME|")) {
                    const base64Image = data.substring(6);
                    document.getElementById('screenView').src = "data:image/jpeg;base64," + base64Image;
                }
            };
        }

        function sendCmd(cmd) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
            }
        }

        function openForm(formName) {
            sendCmd("OPEN_FORM|" + formName);
        }

        // إيماءات اللمس لتحريك الماوس بدقة (Touchpad Logic)
        const touchArea = document.getElementById('touchArea');

        touchArea.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }
        });

        touchArea.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                let currentX = e.touches[0].clientX;
                let currentY = e.touches[0].clientY;

                let deltaX = Math.round((currentX - lastTouchX) * 1.8); // تسريع الحركة
                let deltaY = Math.round((currentY - lastTouchY) * 1.8);

                if (Math.abs(deltaX) > 1 || Math.abs(deltaY) > 1) {
                    sendCmd(`MOVE|${deltaX}|${deltaY}`);
                    lastTouchX = currentX;
                    lastTouchY = currentY;
                }
            }
        });
    </script>
</body>
</html>
