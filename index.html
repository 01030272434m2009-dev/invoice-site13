<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏥 وحدة التحكم المباشر واللمس الشاملة</title>

    <meta name="theme-color" content="#0b1329">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b1329;
            --card-bg: rgba(23, 37, 84, 0.7);
            --border-color: rgba(56, 189, 248, 0.25);
            --primary-blue: #0284c7;
            --medical-cyan: #06b6d4;
            --medical-green: #10b981;
            --medical-red: #ef4444;
            --purple-accent: #8b5cf6;
            --text-light: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            touch-action: none; /* منع أي تعارض مع إيماءات المتصفح */
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* الهيدر العلوي */
        .header {
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            height: 50px;
        }

        .brand-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            font-weight: 700;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--medical-red);
            box-shadow: 0 0 6px var(--medical-red);
        }

        .status-dot.online {
            background: var(--medical-green);
            box-shadow: 0 0 8px var(--medical-green);
        }

        .connection-box {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .ip-input {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            color: var(--medical-cyan);
            padding: 4px 8px;
            border-radius: 6px;
            width: 120px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            outline: none;
        }

        .btn-connect {
            background: linear-gradient(135deg, var(--primary-blue), var(--medical-cyan));
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* شريط التطبيقات */
        .actions-bar {
            display: flex;
            gap: 6px;
            padding: 6px 8px;
            overflow-x: auto;
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
            white-space: nowrap;
            touch-action: pan-x; /* السماح بالتمرير الأفقي فقط للشريط */
        }

        .actions-bar::-webkit-scrollbar { display: none; }

        .app-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* منطقة العرض الرئيسية للكمبيوتر */
        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
            cursor: crosshair;
        }

        #screenView {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* الحفاظ على نسبة أبعاد الشاشة الحقيقية وبأعلى وضوح */
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* لوحة التحكم والكيبورد */
        .controls-container {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-color);
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            touch-action: pan-y;
        }

        .keyboard-drawer {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(30, 41, 59, 0.9);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .hidden-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--medical-cyan);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .btn-key-action {
            background: var(--purple-accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .quick-keys {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
            touch-action: pan-x;
        }

        .quick-key-btn {
            background: rgba(51, 65, 85, 0.8);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .ctrl-btn {
            background: rgba(30, 41, 59, 0.8);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 6px 2px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .ctrl-btn:active, .quick-key-btn:active, .app-btn:active {
            background: var(--primary-blue);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-status">
            <div class="status-badge">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">مفصول</span>
            </div>
        </div>
        <div class="connection-box">
            <input type="text" id="ipAddress" class="ip-input" value="192.168.1.100" placeholder="عنوان IP">
            <button class="btn-connect" onclick="connect()">اتصال</button>
        </div>
    </div>

    <div class="actions-bar">
        <button class="app-btn" onclick="openForm('POS')">🛒 الفواتير</button>
        <button class="app-btn" onclick="openForm('GROUP_SALES')">📊 المبيعات</button>
        <button class="app-btn" onclick="openForm('GROUP_ITEMS')">💊 الأصناف</button>
        <button class="app-btn" onclick="openForm('GROUP_STOCK')">📦 المستودعات</button>
        <button class="app-btn" onclick="openForm('GROUP_ORDERS')">📋 الطلبيات</button>
        <button class="app-btn" onclick="openForm('GROUP_USERS')">🐾 العملاء</button>
        <button class="app-btn" onclick="openForm('GROUP_OFFERS')">🎁 العروض</button>
        <button class="app-btn" onclick="openForm('GROUP_SETTINGS')">⚙️ الإعدادات</button>
        <button class="app-btn" onclick="sendCmd('SHOW_QR')">📱 QR المتجر</button>
    </div>

    <!-- شاشة العرض المباشر مع دعم التاتش والماوس -->
    <div class="viewport" id="touchArea">
        <img id="screenView" src="" alt="بانتظار الاتصال والبث الحي...">
    </div>

    <div class="controls-container">
        <!-- حقل الكيبورد والكتابة السريعة -->
        <div class="keyboard-drawer">
            <input type="text" id="textInput" class="hidden-input" placeholder="اكتب هنا لإرسال النص فوراً..." oninput="onTextInput(this)">
            <button class="btn-key-action" onclick="focusInput()">⌨️ الكيبورد</button>
        </div>

        <!-- أزرار الاختصارات والمفاتيح السريعة -->
        <div class="quick-keys">
            <button class="quick-key-btn" onclick="sendKeyPress('ENTER')">⏎ Enter</button>
            <button class="quick-key-btn" onclick="sendKeyPress('BACKSPACE')">⌫ مسح</button>
            <button class="quick-key-btn" onclick="sendKeyPress('TAB')">⇥ Tab</button>
            <button class="quick-key-btn" onclick="sendKeyPress('SPACE')">⎵ مسافة</button>
            <button class="quick-key-btn" onclick="sendKeyPress('ESC')">Esc</button>
            <button class="quick-key-btn" onclick="sendKeyPress('UP')">▲ أعلى</button>
            <button class="quick-key-btn" onclick="sendKeyPress('DOWN')">▼ أسفل</button>
            <button class="quick-key-btn" onclick="sendKeyPress('LEFT')">◄ يسار</button>
            <button class="quick-key-btn" onclick="sendKeyPress('RIGHT')">► يمين</button>
        </div>

        <div class="controls-grid">
            <button class="ctrl-btn" onclick="sendCmd('CLICK_LEFT')">🖱️ كليك شمال</button>
            <button class="ctrl-btn" onclick="sendCmd('CLICK_RIGHT')">🖱️ كليك يمين</button>
            <button class="ctrl-btn" onclick="sendCmd('SCROLL|120')">🔼 تمرير لأعلى</button>
            <button class="ctrl-btn" onclick="sendCmd('SCROLL|-120')">🔽 تمرير لأسفل</button>
        </div>
    </div>

    <script>
        let ws = null;
        const touchArea = document.getElementById('touchArea');
        const screenView = document.getElementById('screenView');
        const textInput = document.getElementById('textInput');

        let isTouchActive = false;
        let lastTouchTime = 0;

        window.addEventListener('DOMContentLoaded', () => {
            const savedIp = localStorage.getItem('last_connected_ip');
            if (savedIp) {
                document.getElementById('ipAddress').value = savedIp;
            }
        });

        function connect() {
            let ip = document.getElementById('ipAddress').value.trim();
            if (!ip) return alert("يرجى إدخال IP الكمبيوتر أولاً");

            localStorage.setItem('last_connected_ip', ip);

            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            statusText.innerText = "جاري الاتصال...";

            if (ws) { ws.close(); }

            let wsUrl = ip.startsWith("ws://") || ip.startsWith("wss://") ? ip : `ws://${ip}:8080`;

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    statusDot.classList.add('online');
                    statusText.innerText = "متصل حي";
                };

                ws.onclose = () => {
                    statusDot.classList.remove('online');
                    statusText.innerText = "مفصول";
                };

                ws.onerror = () => {
                    statusDot.classList.remove('online');
                    statusText.innerText = "خطأ الاتصال";
                };

                ws.onmessage = (event) => {
                    const data = event.data;
                    if (typeof data === "string" && data.startsWith("FRAME|")) {
                        screenView.src = "data:image/jpeg;base64," + data.substring(6);
                    }
                };
            } catch (err) {
                alert("تعذر إنشاء الاتصال: " + err.message);
            }
        }

        function sendCmd(cmd) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
            }
        }

        function openForm(formKey) {
            sendCmd("OPEN_FORM|" + formKey);
        }

        // ==========================================
        // 🎯 تحكم الماوس واللمس الدقيق الاحترافي
        // ==========================================
        
        function sendRelativePointerPos(clientX, clientY, isClick = false) {
            const rect = screenView.getBoundingClientRect();

            // حساب الموضع بالنسبة للصورة المعروضة فقط
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                const percentX = (x / rect.width).toFixed(4);
                const percentY = (y / rect.height).toFixed(4);
                sendCmd(`TOUCH_ABS|${percentX}|${percentY}|${isClick ? 1 : 0}`);
            }
        }

        // دعم أحداث اللمس (موبايل / تابليت)
        touchArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouchActive = true;
            lastTouchTime = Date.now();
            const touch = e.touches[0];
            sendRelativePointerPos(touch.clientX, touch.clientY, false);
        }, { passive: false });

        touchArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isTouchActive) {
                const touch = e.touches[0];
                sendRelativePointerPos(touch.clientX, touch.clientY, false);
            }
        }, { passive: false });

        touchArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touchDuration = Date.now() - lastTouchTime;
            if (touchDuration < 300 && e.changedTouches.length > 0) {
                const touch = e.changedTouches[0];
                sendRelativePointerPos(touch.clientX, touch.clientY, true);
            }
            isTouchActive = false;
        }, { passive: false });

        // دعم أحداث الماوس (عند استخدام كمبيوتر أو ماوس خارجي)
        let isMouseDown = false;
        touchArea.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            sendRelativePointerPos(e.clientX, e.clientY, true);
        });

        touchArea.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                sendRelativePointerPos(e.clientX, e.clientY, false);
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        // ==========================================
        // ⌨️ إرسال مدخلات الكيبورد وحقول النصوص
        // ==========================================

        function focusInput() {
            textInput.focus();
        }

        function onTextInput(input) {
            const val = input.value;
            if (val.length > 0) {
                sendCmd("KEY_TEXT|" + val);
                input.value = "";
            }
        }

        function sendKeyPress(keyName) {
            sendCmd("KEY_PRESS|" + keyName);
        }

        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendKeyPress('ENTER');
            } else if (e.key === 'Backspace' && textInput.value === '') {
                sendKeyPress('BACKSPACE');
            }
        });
    </script>
</body>
</html>
