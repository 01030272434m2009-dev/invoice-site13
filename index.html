<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏥 وحدة التحكم عن بُعد البيطرية الشاملة</title>

    <!-- Manifest Meta for PWABuilder -->
    <meta name="theme-color" content="#0b1329">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b1329;
            --card-bg: rgba(23, 37, 84, 0.6);
            --border-color: rgba(56, 189, 248, 0.2);
            --primary-blue: #0284c7;
            --medical-cyan: #06b6d4;
            --medical-green: #10b981;
            --medical-red: #ef4444;
            --purple-accent: #8b5cf6;
            --text-light: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 116, 144, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .brand-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            font-weight: 700;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--medical-red);
            box-shadow: 0 0 8px var(--medical-red);
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background: var(--medical-green);
            box-shadow: 0 0 10px var(--medical-green);
        }

        .connection-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ip-input {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            color: var(--medical-cyan);
            padding: 6px 10px;
            border-radius: 8px;
            width: 130px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .ip-input:focus {
            border-color: var(--medical-cyan);
        }

        .btn-connect {
            background: linear-gradient(135deg, var(--primary-blue), var(--medical-cyan));
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-connect:active {
            transform: scale(0.95);
        }

        .actions-bar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            overflow-x: auto;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }

        .actions-bar::-webkit-scrollbar {
            display: none;
        }

        .app-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 7px 13px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .app-btn:active {
            transform: scale(0.94);
            background: var(--primary-blue);
            border-color: var(--medical-cyan);
        }

        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        #screenView {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .touch-hint {
            position: absolute;
            top: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-container {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-color);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
        }

        .ctrl-btn {
            background: rgba(30, 41, 59, 0.8);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 10px 4px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .ctrl-btn:active {
            background: var(--primary-blue);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-status">
            <div class="status-badge">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">مفصول</span>
            </div>
        </div>
        <div class="connection-box">
            <input type="text" id="ipAddress" class="ip-input" value="192.168.1.100" placeholder="عنوان IP">
            <button class="btn-connect" onclick="connect()">اتصال</button>
        </div>
    </div>

    <div class="actions-bar">
        <button class="app-btn" onclick="openForm('POS')">🛒 الفواتير</button>
        <button class="app-btn" onclick="openForm('GROUP_SALES')">📊 المبيعات</button>
        <button class="app-btn" onclick="openForm('GROUP_ITEMS')">💊 الأصناف</button>
        <button class="app-btn" onclick="openForm('GROUP_STOCK')">📦 المخزن والمستودعات</button>
        <button class="app-btn" onclick="openForm('GROUP_ORDERS')">📋 الطلبيات</button>
        <button class="app-btn" onclick="openForm('GROUP_USERS')">🐾 العملاء والحيوانات</button>
        <button class="app-btn" onclick="openForm('GROUP_OFFERS')">🎁 العروض والخصومات</button>
        <button class="app-btn" onclick="openForm('GROUP_SETTINGS')">⚙️ الإعدادات</button>
        <button class="app-btn" onclick="sendCmd('SHOW_QR')">📱 QR المتجر</button>
    </div>

    <div class="viewport" id="touchArea">
        <span class="touch-hint">👆 المس ومرر للتحكم بالماوس | ضغطة للكليك الشمال | ضغطة مطولة للكليك اليمين</span>
        <img id="screenView" src="" alt="بانتظار البث الحي...">
    </div>

    <div class="controls-container">
        <div class="controls-grid">
            <button class="ctrl-btn" onclick="sendCmd('CLICK_LEFT')">
                <span>🖱️</span>
                <span>كليك شمال</span>
            </button>
            <button class="ctrl-btn" onclick="sendCmd('CLICK_RIGHT')">
                <span>🖱️</span>
                <span>كليك يمين</span>
            </button>
            <button class="ctrl-btn" onclick="sendCmd('SCROLL|120')">
                <span>🔼</span>
                <span>أعلى</span>
            </button>
            <button class="ctrl-btn" onclick="sendCmd('SCROLL|-120')">
                <span>🔽</span>
                <span>أسفل</span>
            </button>
        </div>
    </div>

    <script>
        let ws = null;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let touchStartTime = 0;
        let isMoving = false;

        // حفظ واسترجاع الـ IP تلقائياً
        window.addEventListener('DOMContentLoaded', () => {
            const savedIp = localStorage.getItem('last_connected_ip');
            if (savedIp) {
                document.getElementById('ipAddress').value = savedIp;
            }
        });

        function connect() {
            let ip = document.getElementById('ipAddress').value.trim();
            if (!ip) return alert("يرجى إدخال IP الكمبيوتر أولاً");

            localStorage.setItem('last_connected_ip', ip);

            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            statusText.innerText = "جاري الاتصال...";
            
            if (ws) {
                ws.close();
            }

            // لتجاوز حظر الأندرويد للمحتوى غير المشفر، نحدد البوتوكول تلقائياً
            // إذا كان الـ IP يشتمل على http/https نأخذه كما هو، وإلا نستخدم ws البروتوكول الافتراضي
            let wsUrl = ip.startsWith("ws://") || ip.startsWith("wss://") ? ip : `ws://${ip}:8080`;

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    statusDot.classList.add('online');
                    statusText.innerText = "متصل حي";
                };

                ws.onclose = () => {
                    statusDot.classList.remove('online');
                    statusText.innerText = "مفصول";
                };

                ws.onerror = (err) => {
                    statusDot.classList.remove('online');
                    statusText.innerText = "خطأ بالاتصال";
                };

                ws.onmessage = (event) => {
                    const data = event.data;
                    if (typeof data === "string" && data.startsWith("FRAME|")) {
                        const base64Image = data.substring(6);
                        document.getElementById('screenView').src = "data:image/jpeg;base64," + base64Image;
                    }
                };
            } catch (err) {
                alert("تعذر إنشاء الاتصال: " + err.message);
            }
        }

        function sendCmd(cmd) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
            }
        }

        function openForm(formKey) {
            sendCmd("OPEN_FORM|" + formKey);
        }

        // Touch Control Logic
        const touchArea = document.getElementById('touchArea');

        touchArea.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                touchStartTime = Date.now();
                isMoving = false;
            } else if (e.touches.length === 2) {
                lastTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            }
        }, { passive: true });

        touchArea.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                let currentX = e.touches[0].clientX;
                let currentY = e.touches[0].clientY;

                let deltaX = Math.round((currentX - lastTouchX) * 1.7);
                let deltaY = Math.round((currentY - lastTouchY) * 1.7);

                if (Math.abs(deltaX) > 1 || Math.abs(deltaY) > 1) {
                    isMoving = true;
                    sendCmd(`MOVE|${deltaX}|${deltaY}`);
                    lastTouchX = currentX;
                    lastTouchY = currentY;
                }
            } else if (e.touches.length === 2) {
                let currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                let deltaY = Math.round((currentY - lastTouchY) * 3);
                
                if (Math.abs(deltaY) > 5) {
                    sendCmd(`SCROLL|${deltaY}`);
                    lastTouchY = currentY;
                }
            }
        }, { passive: true });

        touchArea.addEventListener('touchend', (e) => {
            const duration = Date.now() - touchStartTime;

            if (!isMoving && duration < 250 && e.changedTouches.length === 1) {
                sendCmd("CLICK_LEFT");
            } 
            else if (!isMoving && duration >= 500 && e.changedTouches.length === 1) {
                sendCmd("CLICK_RIGHT");
            }
        });
    </script>
</body>
</html>
